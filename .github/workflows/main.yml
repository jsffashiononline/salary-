name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line tools are missing on the runner"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Validate project source
        run: |
          test -f package.json || { echo "::error::package.json is missing"; exit 1; }
          test -f index.html || { echo "::error::index.html is missing"; exit 1; }
          test -f src/main.jsx || { echo "::error::src/main.jsx is missing"; exit 1; }
          test -f src/App.jsx || { echo "::error::src/App.jsx is missing"; exit 1; }
          node -e "const p=require('./package.json'); for (const x of ['react','react-dom','vite','@capacitor/core','@capacitor/android','@capacitor/camera']) if (!p.dependencies?.[x] && !p.devDependencies?.[x]) throw Error('Missing dependency: '+x)"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build web application
        run: npm run build

      - name: Add Android platform when missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14